<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>データベース内検索</title>
</head>
<body>
    <h1>データベース内検索</h1>
    <form action="{% url 'search_db' %}" method="post">
        {% csrf_token %}
        <input type="text" name="department" placeholder="学科">
        <input type="number" name="time" placeholder="時限">
        <input type="text" name="day" placeholder="曜日">
        <input type="text" name="season" placeholder="セメスター">
        <button type="submit">検索</button>
    </form>
</body>
</html>
