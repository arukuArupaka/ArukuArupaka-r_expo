<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>スクレイピングフォーム</title>
</head>
<body>
    <h1>スクレイピングテスト</h1>
    <form action="" method="post">
        {% csrf_token %}
        <select name = "department_select">
            <option value="">学科</option>
            <option value="2">法学部</option>
            <option value="3">経済学部</option>
            <option value="4">経営学部</option>
            <option value="5">産業社会学部</option>
            <option value="6">国際関係学部</option>
            <option value="7">政策科学部</option>
            <option value="8">文学部</option>
            <option value="9">映像学部</option>
            <option value="10">総合心理学部</option>
            <option value="11">理工学部</option>
            <option value="12">グローバル教養学部</option>
            <option value="13">食マネジメント学部</option>
            <option value="14">情報理工学部</option>
            <option value="15">生命科学部</option>
            <option value="16">薬学部</option>
            <option value="17">スポーツ健康学部</option>
        </select>
        <select name="day_select">
            <option value="">曜日</option>
            <option value="1">月曜日</option>
            <option value="2">火曜日</option>
            <option value="3">水曜日</option>
            <option value="4">木曜日</option>
            <option value="5">金曜日</option>
        </select>
        <select name="time_select">
            <option value="">時限</option>
            <option value="2">1</option>
            <option value="3">2</option>
            <option value="4">3</option>
            <option value="5">4</option>
            <option value="6">5</option>
            <option value="7">6</option>
            <option value="8">7</option>
        </select>
        <select name="season_select">
            <option value="">セメスター</option>
            <option value="3">春</option>
            <option value="4">秋</option>
        </select> 
        <input type="text" name="class_name">
        <button type="submit">検索する</button>
    </form>
</body>
</html>
